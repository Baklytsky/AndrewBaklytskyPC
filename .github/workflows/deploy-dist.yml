name: Deploy /dist to new-theme-dist

on:
  push:
    branches: [main]
    paths-ignore:
    - '**.md'
    - '.gitignore'
    - '.vscode/**'

jobs:
  cancel:
    name: 'Cancel Previous Runs'
    runs-on: ubuntu-20.04
    timeout-minutes: 3
    steps:
    - uses: styfle/cancel-workflow-action@0.12.1
      with:
        workflow_id: 10963554
  yarn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'yarn'
        always-auth: true
        registry-url: https://npm.pkg.github.com/
    - uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-v1-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-node-modules-v1-
    - name: Yarn install
      run: yarn install --frozen-lockfile
      env:
        NODE_AUTH_TOKEN: ${{secrets.ORG_PKG_READ}}
  build:
    needs: [yarn]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'yarn'
    - uses: actions/cache@v4
      id: node_modules-cache
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-v1-${{ hashFiles('yarn.lock') }}
        fail-on-cache-miss: true
    - uses: actions/cache@v4
      id: build-cache
      with:
        path: dist
        key: ${{ runner.os }}-dist-v1.5-${{ hashFiles('src/**/*', 'yarn.lock') }}
    - name: Build Theme
      run: yarn build
    - name: Get latest commit SHA
      id: get_latest_sha
      run: echo "sha=$(git log -n 1 --format="%h")" >> $GITHUB_OUTPUT
    - name: Update versions in files
      run: |
        jq '.[0].theme_version = "${{ steps.get_latest_sha.outputs.sha }}"' dist/config/settings_schema.json > settings.tmp && mv settings.tmp dist/config/settings_schema.json
    - name: Ensure dist/ is not empty
      run: if [ -z "$(ls -A dist 2>/dev/null)" ]; then exit 1; fi
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ vars.THEME_NAME }}-dist
        path: dist/*
        retention-days: 5
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ vars.THEME_NAME }}-zip
        path: upload/*
        retention-days: 5

  deploy-dist:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source repository
      uses: actions/checkout@v3

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan github.com >> ~/.ssh/known_hosts

    - name: Remove existing new-theme-dist folder if it exists
      run: |
        if [ -d "new-theme-dist" ]; then
          rm -rf new-theme-dist
        fi

    - name: Clone target repository
      run: |
        git clone git@github.com:invisiblethemes/new-theme-dist.git new-theme-dist

    - name: Sync /dist to new-theme-dist
      run: |
        # Copy the /dist folder to the target repository
        rsync -av --delete dist/ new-theme-dist/
        # Commit and push changes
        cd new-theme-dist
        git config user.name "GitHub Actions"
        git config user.email "github-actions@github.com"
        git add .
        git commit -m "Update /dist from new-theme commit $GITHUB_SHA" || echo "No changes to commit"
        git push origin main
