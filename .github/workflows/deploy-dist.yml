name: Deploy /dist to new-theme-dist

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.vscode/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        always-auth: true
        registry-url: https://npm.pkg.github.com/
    - name: Get yarn cache directory path
      id: yarn-cache-dir-path
      run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT
    - uses: actions/cache@v4
      id: yarn-cache
      with:
        path: |
          ${{ steps.yarn-cache-dir-path.outputs.dir }}
          'node_modules'
        key: ${{ runner.os }}-yarn-v3-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-v3-
    - run: yarn install
      env:
        NODE_AUTH_TOKEN: ${{secrets.ORG_PKG_READ}}
    - name: "Build assets"
      run: |
        yarn build:assets
        pwd

    - uses: actions/upload-artifact@v4
      with:
          path: dist/*
          retention-days: 1

    - name: Checkout source repository
      uses: actions/checkout@v3

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan github.com >> ~/.ssh/known_hosts
        pwd

    - name: Remove existing new-theme-dist folder if it exists
      run: |
        if [ -d "new-theme-dist" ]; then
          rm -rf new-theme-dist
        fi

    - name: Clone target repository
      run: |
        cd ~/
        git clone git@github.com:invisiblethemes/new-theme-dist.git new-theme-dist

    - name: Sync /dist contents to the root of new-theme-dist
      run: |
        # Ensure the dist folder exists
        pwd
        ls .
        if [ -d "~/work/new-theme/new-theme/dist" ]; then
          rsync -av --delete --exclude '.git/' ~/work/new-theme/new-theme/dist/ ~/new-theme-dist/
        else
          echo "No dist folder found, skipping sync."
          exit 1
        fi
        # Commit and push changes
        cd ~/new-theme-dist
        git remote set-url origin git@github.com:invisiblethemes/new-theme-dist.git
        git config user.name "GitHub Actions"
        git config user.email "github-actions@github.com"
        git add .
        git commit -m "Update files from /dist (commit $GITHUB_SHA)" || echo "No changes to commit"
        git push origin main